<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Pixi Editor app icon (macOS layout: 824px tile centred on a 1024px canvas). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3352"/>
      <stop offset="1" stop-color="#151829"/>
    </linearGradient>
    <linearGradient id="sprite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7ab6"/>
      <stop offset="1" stop-color="#d0246b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tileClip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse" x="100" y="100">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3"/>
    </pattern>
  </defs>

  <!-- tile -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  </g>
  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#grid)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#shine)"/>
  </g>
  <rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="8"/>

  <!-- the "sprite" being edited -->
  <g filter="url(#soft)">
    <rect x="352" y="332" width="300" height="300" rx="70" transform="rotate(45 502 482)" fill="url(#sprite)"/>
  </g>
  <circle cx="502" cy="482" r="58" fill="#ffffff" fill-opacity="0.92"/>

  <!-- selection box with transform handles -->
  <rect x="270" y="250" width="464" height="464" fill="none" stroke="#4fd1ff" stroke-width="12" stroke-dasharray="34 22"/>
  <g fill="#ffffff" stroke="#4fd1ff" stroke-width="10">
    <rect x="244" y="224" width="52" height="52" rx="10"/>
    <rect x="708" y="224" width="52" height="52" rx="10"/>
    <rect x="244" y="688" width="52" height="52" rx="10"/>
    <rect x="708" y="688" width="52" height="52" rx="10"/>
  </g>

  <!-- pointer -->
  <g filter="url(#soft)" transform="translate(640 610) rotate(-8)">
    <path d="M0 0 L0 236 L58 182 L102 278 L146 258 L102 164 L182 160 Z"
          fill="#ffffff" stroke="#151829" stroke-width="16" stroke-linejoin="round"/>
  </g>
</svg>
